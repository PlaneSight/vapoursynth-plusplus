[project]
site_name = "vapoursynth-plusplus"
site_description = "A C++23, header-oriented layer for authoring VapourSynth API 4 filters."
site_url = "https://planesight.github.io/vapoursynth-plusplus/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/PlaneSight/vapoursynth-plusplus"
repo_name = "PlaneSight/vapoursynth-plusplus"
edit_uri = "edit/master/docs/"

nav = [
    { "Home" = "index.md" },
    { "Get started" = [
        "getting-started/index.md",
        { "Installation" = "getting-started/installation.md" },
        { "Your first filter" = "getting-started/first-filter.md" },
    ] },
    { "Concepts" = [
        "concepts/index.md",
        { "Filter lifecycle" = "concepts/filter-lifecycle.md" },
        { "Frames and ownership" = "concepts/frames-and-ownership.md" },
        { "Scheduling and dependencies" = "concepts/scheduling.md" },
    ] },
    { "Reference" = [
        "reference/index.md",
        { "Registration" = "reference/registration.md" },
        { "CoreProxy" = "reference/core.md" },
        { "API 4.2 extensions" = "reference/api42-extensions.md" },
        { "VideoNode and VideoFrame" = "reference/video.md" },
        { "Maps and functions" = "reference/maps-and-functions.md" },
        { "Formats and metadata" = "reference/formats.md" },
    ] },
    { "Examples" = [
        { "Overview" = "examples/index.md" },
        { "Example catalog" = "examples/catalog.md" },
        { "Palette source filter" = "examples/palette.md" },
        { "GaussBlur neighborhood filter" = "examples/gauss-blur.md" },
        { "GaussBlurFast specialized loops" = "examples/gauss-blur-fast.md" },
        { "Crop typed dispatch" = "examples/crop.md" },
        { "TemporalMedian frame windows" = "examples/temporal-median.md" },
        { "MaskedMerge multi-input filter" = "examples/masked-merge.md" },
        { "ModifyFrame callbacks" = "examples/modify-frame.md" },
        { "SeparableConvolution workflow" = "examples/separable-convolution.md" },
        { "Rec601ToRGB format conversion" = "examples/rec601-to-rgb.md" },
    ] },
    { "Project" = [
        "project/index.md",
        { "Repository structure" = "project/repository-structure.md" },
        { "C++23 and compiler portability" = "project/cpp23-and-portability.md" },
        { "C++26 adoption roadmap" = "project/cpp26-roadmap.md" },
        { "Contributing" = "project/contributing.md" },
    ] },
]

[project.theme]
features = [
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.indexes",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.tracking",
    "navigation.top",
    "toc.follow",
    "search.highlight",
    "content.code.copy",
    "content.tabs.link",
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
