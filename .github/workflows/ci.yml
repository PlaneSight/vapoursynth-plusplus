name: Build

on:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch VapourSynth API headers
        run: git clone --depth=1 https://github.com/vapoursynth/vapoursynth.git "$RUNNER_TEMP/vapoursynth"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install build tools
        run: uv sync --group build --locked

      - name: Build and test library
        run: |
          uv run --group build meson setup build-library \
            -Dvapoursynth_include_dir="$RUNNER_TEMP/vapoursynth/include"
          uv run --group build meson compile -C build-library
          uv run --group build meson test -C build-library --print-errorlogs

      - name: Build and test standalone examples
        run: |
          uv run --group build meson setup build-examples examples \
            -Dvapoursynth_include_dir="$RUNNER_TEMP/vapoursynth/include"
          uv run --group build meson compile -C build-examples
          uv run --group build meson test -C build-examples --print-errorlogs

  msvc:
    name: MSVC
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Fetch VapourSynth API headers
        shell: pwsh
        run: git clone --depth=1 https://github.com/vapoursynth/vapoursynth.git "$env:RUNNER_TEMP\vapoursynth"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install build tools
        run: uv sync --group build --locked

      - name: Build and test library
        shell: pwsh
        run: |
          uv run --group build meson setup build-library `
            "-Dvapoursynth_include_dir=$env:RUNNER_TEMP\vapoursynth\include"
          uv run --group build meson compile -C build-library
          uv run --group build meson test -C build-library --print-errorlogs

      - name: Build and test standalone examples
        shell: pwsh
        run: |
          uv run --group build meson setup build-examples examples `
            "-Dvapoursynth_include_dir=$env:RUNNER_TEMP\vapoursynth\include"
          uv run --group build meson compile -C build-examples
          uv run --group build meson test -C build-examples --print-errorlogs

  runtime:
    name: VapourSynth R78 runtime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install build and runtime dependencies
        run: uv sync --group build --group runtime-test --locked

      - name: Configure VapourSynth
        run: uv run --group runtime-test vapoursynth config

      - name: Build standalone examples against R78
        run: |
          include_dir="$(uv run --group runtime-test python -c 'import vapoursynth as vs; print(vs.get_include())')"
          uv run --group build meson setup build-runtime examples \
            -Dvapoursynth_include_dir="$include_dir"
          uv run --group build meson compile -C build-runtime
          uv run --group build meson test -C build-runtime --print-errorlogs

      - name: Request and verify a frame through vspipe
        env:
          VAPOURSYNTH_PLUSPLUS_EXAMPLE: ${{ github.workspace }}/build-runtime/libvapoursynth-plusplus-example.so
        run: uv run --group runtime-test vspipe --info tests/examples/runtime.vpy -

      - name: Verify the audio example through the Python runtime
        env:
          VAPOURSYNTH_PLUSPLUS_EXAMPLE: ${{ github.workspace }}/build-runtime/libvapoursynth-plusplus-example.so
        run: uv run --group runtime-test python tests/examples/audio_runtime.py

      - name: Verify generated example catalog
        run: |
          uv run --group runtime-test python -m tools.example_catalog \
            --plugin build-runtime/libvapoursynth-plusplus-example.so \
            --check
